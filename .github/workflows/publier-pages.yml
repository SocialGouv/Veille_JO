name: Veille JO quotidienne + publication GitHub Pages

# Déclenchement :
#   - tous les jours à 05:00 UTC (06h/07h à Paris selon heure d'été/hiver — après le
#     passage de minuit côté France, donc la date UTC du run correspond déjà à la date
#     JO française traitée par défaut par main.py, cf. `date.today()`) ;
#   - manuellement depuis l'onglet Actions (bouton « Run workflow »), pour tester.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Date du JO à traiter (AAAA-MM-JJ). Laisser vide pour aujourd'hui."
        required: false
        type: string

# Requis pour pousser la page générée sur la branche gh-pages.
permissions:
  contents: write

jobs:
  veille-et-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter la veille du jour
        id: veille
        # continue-on-error : un échec (JO introuvable, PISTE en panne…) écrit quand
        # même un fichier `alerte_<date>.html` dans sorties/ (garde-fou E9) — on veut le
        # publier plutôt que de s'arrêter net. Le job n'est mis en échec en fin de run
        # que si le code retour de main.py l'indique (voir dernière étape) : 2 (JO pas
        # encore publié côté DILA, cas bénin — incident du 10/08/2026) reste vert, tout
        # le reste (1) passe le job en échec.
        continue-on-error: true
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
        run: |
          set +e
          python main.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Préparer le dossier de publication (branche gh-pages)
        run: |
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add gh-pages-checkout gh-pages
          else
            echo "Branche gh-pages introuvable : création (premier lancement)."
            git worktree add --orphan -b gh-pages gh-pages-checkout
          fi

      - name: Générer/compléter la page (archive + index)
        run: python scripts/publier_page.py

      - name: Publier sur gh-pages
        working-directory: gh-pages-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Publication du $(date -u +%Y-%m-%d)"
            git push origin HEAD:gh-pages
          fi

      - name: Signaler l'échec de la veille (panne réelle uniquement — JO pas encore publié reste vert)
        # Code 2 = JO introuvable à la date demandée (cas bénin le plus souvent : DILA
        # n'a pas encore publié — incident du 10/08/2026) : pas d'échec de job, l'alerte
        # publiée suffit. Tout code ≠ 0 et ≠ 2 (PISTE en panne, --date invalide,
        # exception inattendue) reste un échec visible.
        if: steps.veille.outputs.code != '0' && steps.veille.outputs.code != '2'
        run: |
          echo "::error::La veille du jour a échoué (code retour ${{ steps.veille.outputs.code }} — voir l'étape « Exécuter la veille du jour »). Une page d'alerte a tout de même été publiée."
          exit 1
